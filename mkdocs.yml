site_name: VersiRef

# The docs live inside the package so they ship as package data (reachable via
# importlib.resources and the `versiref docs` command). api.md is generated by
# scripts/build_api_md.py; run it before `mkdocs build`.
docs_dir: src/versiref/docs

theme:
  name: material

plugins:
  - search

nav:
  - Home: index.md
  - API Reference: api.md
  - CLI Reference: cli.md
